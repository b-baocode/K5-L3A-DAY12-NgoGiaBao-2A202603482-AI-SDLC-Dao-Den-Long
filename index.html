<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0716; font-family: system-ui, sans-serif; color: #ffe9c4; }
      #hud { position: fixed; top: 12px; left: 12px; display: grid; gap: 6px; font-size: 15px; text-shadow: 0 1px 3px #000; pointer-events: none; }
      #hud .row { display: flex; gap: 14px; }
      #hud b { color: #ffb347; }
      #help { position: fixed; bottom: 10px; left: 12px; font-size: 12px; opacity: .75; pointer-events: none; }
      #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(10, 5, 25, .65); }
      #overlay .card { text-align: center; padding: 28px 40px; border-radius: 14px; background: #1c1233; border: 1px solid #ffb34766; }
      #overlay h1 { margin: 0 0 8px; color: #ffb347; }
      #toast { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); max-width: min(640px, 90vw); text-align: center; padding: 10px 18px; border-radius: 10px; background: rgba(28, 18, 51, .75); border: 1px solid #ffb34755; font-size: 16px; opacity: 0; transition: opacity .6s; pointer-events: none; }
      #legend { position: fixed; top: 12px; right: 12px; font-size: 12px; line-height: 1.7; text-align: right; opacity: .85; pointer-events: none; text-shadow: 0 1px 3px #000; }
      #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
      #cool { width: 120px; height: 6px; background: #3a2a55; border-radius: 3px; overflow: hidden; }
      #cool > div { height: 100%; background: #ffb347; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="row"><span>Lửa: <b id="flames"></b></span><span>Đom đóm: <b id="carried"></b></span><span>Đèn: <b id="lit"></b></span></div>
      <div class="row"><span>Thời gian: <b id="time"></b></span><span>Điểm: <b id="score"></b></span></div>
      <div class="row"><span>Tỏa sáng</span><div id="cool"><div></div></div></div>
    </div>
    <div id="toast"></div>
    <div id="legend">
      Đom đóm<i style="background:#ffe066"></i><br />
      Vàng Kim ×2<i style="background:#ffa800"></i><br />
      Ngọc Lam +1 lửa<i style="background:#5fffe0"></i><br />
      Mực Lướt: nhanh<i style="background:#8a2be2"></i><br />
      Mực Khổng Lồ: với xa<i style="background:#24082f;border:1px solid #888"></i>
    </div>
    <div id="help">WASD di chuyển · Kéo chuột / Q C xoay camera · Space nhảy · E nạp đèn · F / chuột phải tỏa sáng · R chơi lại</div>
    <div id="overlay"><div class="card"><h1 id="ov-title"></h1><div id="ov-text"></div><p>Nhấn <b>R</b> để chơi lại</p></div></div>
    <script type="module" src="/src/web/main.js"></script>
  </body>
</html>
